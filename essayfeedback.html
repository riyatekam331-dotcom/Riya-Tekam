<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>AI Essay Feedback Assistant</title>

<style>

*{
    box-sizing:border-box;
}

body{
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#c471ed,#f64f59);
margin:0;
padding:20px;
min-height:100vh;
}


.navbar{
    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(10px);
    padding:18px;
    color:white;
    text-align:center;
    font-size:25px;
    font-weight:bold;
}


/* Main Card */

.container{

    width:90%;
    max-width:900px;
    margin:40px auto;

    background:rgba(255,255,255,0.95);
    padding:35px;

    border-radius:25px;

    box-shadow:0 15px 40px rgba(0,0,0,0.3);

}


/* Heading */

h1{
    text-align:center;
    color:#5b2c91;
}

.subtitle{
    text-align:center;
    color:#666;
}



label{
    font-weight:bold;
    color:#333;
}


input,textarea,select{

    width:100%;
    padding:14px;

    margin:8px 0 18px;

    border:none;
    background:#f1f3ff;

    border-radius:12px;

    font-size:15px;

}

button{

    width:100%;

    padding:15px;

    border:none;

    border-radius:30px;

    background:linear-gradient(45deg,#ff512f,#dd2476);

    color:white;

    font-size:18px;

    cursor:pointer;

}


button:hover{

    transform:scale(1.03);

}
.result{

    margin-top:30px;

    background:#f8f9ff;

    padding:25px;

    border-radius:20px;

}


.score-card{

    display:flex;

    justify-content:space-around;

    flex-wrap:wrap;

}


.score{

    background:linear-gradient(135deg,#667eea,#764ba2);

    color:white;

    padding:20px;

    margin:10px;

    border-radius:20px;

    text-align:center;

    width:180px;

}


h3{

color:#764ba2;

}


.footer{

text-align:center;

color:white;

padding:20px;

}


</style>

</head>


<body>


<div class="navbar">
🤖 AI Essay Feedback Assistant
</div>



<div class="container">


<h1>Smart Writing Analyzer</h1>

<p class="subtitle">
Analyze grammar, clarity, argument and vocabulary instantly
</p>



<label>Grade Level</label>

<select id="grade">

<option>Grade 6</option>
<option>Grade 7</option>
<option>Grade 8</option>
<option>Grade 9</option>
<option>Grade 10</option>
<option>Grade 11</option>
<option>Grade 12</option>
<option>College</option>

</select>



<label>Subject</label>

<input id="subject" placeholder="Example: English">



<label>Essay Topic</label>

<input id="topic" placeholder="Enter essay topic">



<label>Student Essay</label>

<textarea id="essay"
placeholder="Paste student essay here..."></textarea>



<button onclick="analyze()">
✨ Analyze Essay
</button>



<div class="result" id="output">

<h2>AI Report will appear here</h2>

</div>


</div>



<div class="footer">

© 2026 AI Learning Assistant

</div>




<script>


function analyze(){


let essay=document.getElementById("essay").value;


let words=essay.trim().split(/\s+/).length;

let sentences=essay.split(".").length-1;


let grammar=3;
let clarity=3;
let argument=3;
let vocabulary=3;



if(words>50){

clarity++;
argument++;

}


if(words>120){

vocabulary++;

}


if(sentences>=5){

clarity++;

}


if(essay.includes(".")){

grammar++;

}


if(essay[0]===essay[0].toUpperCase()){

grammar++;

}



grammar=Math.min(grammar,5);
clarity=Math.min(clarity,5);
argument=Math.min(argument,5);
vocabulary=Math.min(vocabulary,5);



let total=grammar+clarity+argument+vocabulary;



document.getElementById("output").innerHTML=

`

<h2>📊 AI Evaluation Report</h2>


<div class="score-card">

<div class="score">
Grammar<br>
${grammar}/5
</div>


<div class="score">
Clarity<br>
${clarity}/5
</div>


<div class="score">
Argument<br>
${argument}/5
</div>


<div class="score">
Vocabulary<br>
${vocabulary}/5
</div>

</div>


<h2>🏆 Total Score : ${total}/20</h2>


<h3>✅ Strengths</h3>

<ul>

<li>Essay topic is understandable.</li>

<li>Ideas are presented clearly.</li>

</ul>



<h3>🔧 Improvements</h3>

<ul>

<li>Add examples and supporting evidence.</li>

<li>Improve sentence variety.</li>

<li>Use advanced vocabulary.</li>

</ul>



<h3>🤖 AI Recommendation</h3>

<p>

Your writing shows good understanding.
Keep practicing explanation, organization and vocabulary.

</p>


`;

}



</script>


</body>
</html>
